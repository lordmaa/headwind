# Public Headwind demo. Build on the host that runs it (arm64 on the Pi):
#   docker compose -f demo/docker-compose.demo.yml up -d --build
services:
  headwind-demo:
    build: ..
    container_name: headwind-demo
    entrypoint: ["/app/demo/docker-entrypoint.sh"]
    ports:
      - "5003:5001"
    environment:
      - HEADWIND_DEMO=1
      - APP_USERNAME=test
      - APP_PASSWORD=test
      - SECRET_KEY=${DEMO_SECRET_KEY:-change-me-demo-secret}
      - TELEMETRY=off
      - DATABASE_URL=/data/bike.db
      - DEMO_PRISTINE_DB=/demo/pristine.db
      - DEMO_PRISTINE_BIKEIMG=/demo/bikeimg
      - APP_URL=${DEMO_APP_URL:-http://localhost:5003}
    volumes:
      - demo-data:/data
      - ./out:/demo:ro
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.5
    labels:
      - com.centurylinklabs.watchtower.enable=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5001/demo/health')"]
      interval: 60s
      timeout: 10s
      retries: 3
volumes:
  demo-data:
