name: Windows build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -r requirements.txt waitress pyinstaller
      - name: Tests
        run: python -m pytest tests -q
      - name: Build Headwind.exe
        run: python scripts/build_windows.py dist
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $env:HEADWIND_DATA = "$PWD\smoke-data"; $env:PORT = "5099"; $env:TELEMETRY = "off"
          $env:HEADWIND_NO_TRAY = "1"; $env:HEADWIND_NO_BROWSER = "1"
          $p = Start-Process -FilePath "dist\Headwind\Headwind.exe" -PassThru
          Start-Sleep -Seconds 20
          try {
            $r = Invoke-WebRequest "http://127.0.0.1:5099/login" -UseBasicParsing
            $css = Invoke-WebRequest "http://127.0.0.1:5099/static/css/style.css" -UseBasicParsing
            Write-Host "login=$($r.StatusCode) css=$($css.StatusCode)"
            if ($r.StatusCode -ne 200 -or $css.StatusCode -ne 200) { exit 1 }
            # sign in with the first-run password and load pages that exercise date formatting and the Gear module
            $log = Get-Content "$env:HEADWIND_DATA\headwind.log" -Raw
            $pw = [regex]::Match($log, 'password[^\r\n]*?:\s*(\S+)', 'IgnoreCase').Groups[1].Value
            if ($pw) {
              $body = @{ username = 'admin'; password = $pw }
              Invoke-WebRequest "http://127.0.0.1:5099/login" -Method Post -Body $body -SessionVariable ws -UseBasicParsing -MaximumRedirection 0 -ErrorAction SilentlyContinue | Out-Null
              foreach ($u in '/gear/', '/gear/assign', '/workouts', '/static/js/gear_assign.js') {
                $x = Invoke-WebRequest "http://127.0.0.1:5099$u" -WebSession $ws -UseBasicParsing -ErrorAction SilentlyContinue
                Write-Host "$u=$($x.StatusCode)"
                if ($x.StatusCode -ne 200) { exit 1 }
              }
            } else { Write-Host "(first-run password not found in log; skipped the signed-in checks)" }
          } finally {
            # the windowed exe writes its console output to a log file
            Get-Content "$env:HEADWIND_DATA\headwind.log" -ErrorAction SilentlyContinue | Select-String -NotMatch "password" | Write-Host
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\Headwind -DestinationPath Headwind-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Headwind-windows-x64
          path: Headwind-windows-x64.zip
      - name: Attach to GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" Headwind-windows-x64.zip --prerelease --title "Headwind $env:GITHUB_REF_NAME" --notes "Experimental beta. Windows build: extract the zip and run Headwind\Headwind.exe (see the README's Windows section). Unsigned, so SmartScreen will warn."
